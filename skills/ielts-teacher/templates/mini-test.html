<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TEST_TITLE}} — IELTS Claude Teacher</title>
<!--
  mini-test.html — Self-contained template for Claude-generated practice tests.
  Claude replaces {{PLACEHOLDERS}} with test content, saves to .ielts/lesson-plans/.

  Supported question types (v1): true-false-not-given, multiple-choice, gap-fill, matching
  Posts results to File Bridge POST /save. Falls back to localStorage.

  Design: typography-driven, desktop-first, semantic colors, keyboard accessible.
-->
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    --color-bg: #fafaf9;
    --color-surface: #ffffff;
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #6b7280;
    --color-text-tertiary: #9ca3af;
    --color-border: #e5e7eb;
    --color-border-hover: #d1d5db;
    --color-accent: #2563eb;
    --color-accent-hover: #1d4ed8;
    --color-accent-bg: #eff6ff;
    --color-success: #059669;
    --color-success-bg: #ecfdf5;
    --color-success-text: #065f46;
    --color-error: #dc2626;
    --color-error-bg: #fef2f2;
    --color-error-text: #991b1b;
    --color-warning: #d97706;
    --color-warning-bg: #fffbeb;
    --color-warning-text: #92400e;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --transition: 0.15s ease;
  }

  /* ============================================================
     RESET & BASE
     ============================================================ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: var(--font-stack);
    background: var(--color-bg);
    color: var(--color-text-primary);
    line-height: 1.6;
  }

  /* ============================================================
     LAYOUT — centered reading column
     ============================================================ */
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .test-header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--color-border); }
  .test-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-accent);
    background: var(--color-accent-bg);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
  }
  .test-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--color-text-primary);
    margin-bottom: 8px;
  }
  .test-instructions {
    font-size: 15px;
    color: var(--color-text-secondary);
    max-width: 560px;
    line-height: 1.6;
  }

  /* ============================================================
     QUESTIONS
     ============================================================ */
  .question-group { display: flex; flex-direction: column; gap: 28px; }
  .question {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    transition: border-color var(--transition);
    position: relative;
  }
  .question:hover { border-color: var(--color-border-hover); }
  .question.unanswered {
    border-color: var(--color-warning);
    box-shadow: 0 0 0 1px var(--color-warning);
  }
  .question-number {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 16px;
    line-height: 1.55;
  }

  /* ============================================================
     T/F/NG — horizontal radio buttons with semantic colors
     ============================================================ */
  .options-row { display: flex; gap: 8px; }
  .options-row .option { flex: 1; position: relative; }
  .options-row .option input {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }
  .options-row .option label {
    display: block;
    text-align: center;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    background: var(--color-bg);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .options-row .option label:hover { border-color: #9ca3af; color: var(--color-text-primary); }
  .options-row .option input:focus-visible + label {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  /* TRUE = green */
  .options-row .option input:checked + label.label-true {
    background: var(--color-success-bg);
    border-color: var(--color-success);
    color: var(--color-success);
  }
  /* FALSE = red */
  .options-row .option input:checked + label.label-false {
    background: var(--color-error-bg);
    border-color: var(--color-error);
    color: var(--color-error);
  }
  /* NOT GIVEN = amber */
  .options-row .option input:checked + label.label-not-given {
    background: var(--color-warning-bg);
    border-color: var(--color-warning);
    color: var(--color-warning);
  }

  /* ============================================================
     MULTIPLE CHOICE — vertical radio buttons
     ============================================================ */
  .options-vertical { display: flex; flex-direction: column; gap: 6px; }
  .options-vertical .option-mc { position: relative; }
  .options-vertical .option-mc input {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }
  .options-vertical .option-mc label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
    background: var(--color-bg);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .options-vertical .option-mc label:hover { border-color: #9ca3af; }
  .options-vertical .option-mc input:focus-visible + label {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .options-vertical .option-mc input:checked + label {
    background: var(--color-accent-bg);
    border-color: var(--color-accent);
    color: var(--color-accent);
    font-weight: 600;
  }
  .option-label-marker {
    font-weight: 700;
    font-size: 13px;
    color: var(--color-text-tertiary);
    min-width: 18px;
  }
  .options-vertical .option-mc input:checked + label .option-label-marker {
    color: var(--color-accent);
  }

  /* ============================================================
     GAP-FILL — inline text input
     ============================================================ */
  .gap-fill-text {
    font-size: 16px;
    line-height: 2;
    color: var(--color-text-primary);
  }
  .gap-input {
    display: inline-block;
    width: 140px;
    padding: 4px 10px;
    font-size: 15px;
    font-family: var(--font-stack);
    color: var(--color-text-primary);
    background: var(--color-bg);
    border: 1.5px solid var(--color-border);
    border-bottom: 2px solid var(--color-accent);
    border-radius: var(--radius-sm);
    transition: border-color var(--transition);
    vertical-align: baseline;
  }
  .gap-input:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
  .gap-input.error { border-color: var(--color-error); border-bottom-color: var(--color-error); }

  /* ============================================================
     MATCHING — dropdown per item
     ============================================================ */
  .matching-table { width: 100%; border-collapse: collapse; }
  .matching-table th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-secondary);
    padding: 8px 12px;
    border-bottom: 1.5px solid var(--color-border);
  }
  .matching-table td {
    padding: 10px 12px;
    font-size: 14px;
    border-bottom: 1px solid var(--color-border);
  }
  .matching-table tr:last-child td { border-bottom: none; }
  .matching-select {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    font-family: var(--font-stack);
    color: var(--color-text-primary);
    background: var(--color-bg);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: border-color var(--transition);
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 32px;
  }
  .matching-select:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  /* ============================================================
     SUBMIT AREA
     ============================================================ */
  .submit-area {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .btn-submit {
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font-stack);
    color: white;
    background: var(--color-accent);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background var(--transition);
  }
  .btn-submit:hover { background: var(--color-accent-hover); }
  .btn-submit:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .submit-hint { font-size: 13px; color: var(--color-text-tertiary); }

  /* ============================================================
     VALIDATION WARNING
     ============================================================ */
  .validation-warning {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-warning-text);
    background: var(--color-warning-bg);
    border: 1px solid #fcd34d;
    border-radius: var(--radius-md);
  }
  .validation-warning.visible { display: block; }

  /* ============================================================
     RESULTS
     ============================================================ */
  .results { display: none; margin-top: 40px; }
  .results.visible { display: block; }

  .results-header {
    padding: 20px 24px;
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
    text-align: center;
  }
  .results-header.needs-work {
    background: #fef3c7;
    border: 1px solid #fcd34d;
  }
  .results-header.great-job {
    background: #d1fae5;
    border: 1px solid #6ee7b7;
  }
  .results-score {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .results-header.needs-work .results-score { color: #92400e; }
  .results-header.great-job .results-score { color: #065f46; }
  .results-label { font-size: 14px; font-weight: 600; margin: 4px 0 8px; }
  .results-header.needs-work .results-label { color: #92400e; }
  .results-header.great-job .results-label { color: #065f46; }
  .results-message { font-size: 14px; line-height: 1.5; }
  .results-header.needs-work .results-message { color: #78350f; }
  .results-header.great-job .results-message { color: #064e3b; }

  .result-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    margin-bottom: 8px;
    font-size: 14px;
  }
  .result-item.correct { background: var(--color-success-bg); color: var(--color-success-text); }
  .result-item.incorrect { background: var(--color-error-bg); color: var(--color-error-text); }
  .result-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; font-weight: 700; }

  /* ============================================================
     SERVER WARNING (localStorage fallback)
     ============================================================ */
  .warning-banner {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--color-warning-bg);
    border: 1px solid #fcd34d;
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--color-warning-text);
  }
  .warning-banner.visible { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn-retry {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-stack);
    color: var(--color-warning-text);
    background: white;
    border: 1px solid #fcd34d;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--transition);
  }
  .btn-retry:hover { background: #fef3c7; }

  /* ============================================================
     RESPONSIVE (basic)
     ============================================================ */
  @media (max-width: 720px) {
    .container { padding: 24px 16px; }
    .test-title { font-size: 22px; }
    .options-row { flex-direction: column; }
  }

  /* ============================================================
     FOCUS VISIBLE — keyboard navigation
     ============================================================ */
  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="container" role="main" aria-label="{{TEST_TITLE}}">

  <!-- ============================================================
       HEADER — Claude replaces {{TEST_TITLE}}, {{INSTRUCTIONS}}
       ============================================================ -->
  <header class="test-header">
    <div class="test-badge" aria-label="Skill and question type">{{SKILL_LABEL}} · {{QUESTION_TYPE_LABEL}}</div>
    <h1 class="test-title">{{TEST_TITLE}}</h1>
    <p class="test-instructions">{{INSTRUCTIONS}}</p>
  </header>

  <!-- ============================================================
       QUESTIONS — Claude replaces {{QUESTIONS_JSON}}
       ============================================================ -->
  <form id="test-form" novalidate aria-label="Practice test questions">
    <div class="question-group" id="questions-container">
      <!-- Questions rendered by JS from {{QUESTIONS_JSON}} -->
    </div>

    <!-- Submit -->
    <div class="submit-area">
      <button type="submit" class="btn-submit" id="btn-submit">Submit Answers</button>
      <span class="submit-hint" id="submit-hint">{{QUESTIONS_COUNT}} questions</span>
    </div>

    <!-- Validation warning -->
    <div class="validation-warning" id="validation-warning" role="alert">
      Please answer all questions before submitting. <span id="unanswered-count"></span> question(s) remaining.
    </div>
  </form>

  <!-- Results -->
  <section class="results" id="results" aria-live="polite" aria-label="Test results"></section>

  <!-- Server warning -->
  <div class="warning-banner" id="warning-banner" role="alert">
    <span>&#9888; Server not running. Results saved locally.</span>
    <button class="btn-retry" onclick="retrySave()">Start server.py and click Retry</button>
  </div>

</div>

<!-- ============================================================
     TEST DATA — Claude replaces {{QUESTIONS_JSON}} and {{KC_TAGS}}
     ============================================================ -->
<script>
window.__TEST_DATA__ = {{QUESTIONS_JSON}};
window.__KC_TAGS__ = {{KC_TAGS}};
</script>

<!-- ============================================================
     APP LOGIC
     ============================================================ -->
<script>
(function() {
  'use strict';

  const questions = window.__TEST_DATA__ || [];
  const kcTags = window.__KC_TAGS__ || [];
  const BRIDGE_URL = 'http://localhost:8765';

  const container = document.getElementById('questions-container');
  const form = document.getElementById('test-form');
  const resultsDiv = document.getElementById('results');
  const warningBanner = document.getElementById('warning-banner');
  const validationWarning = document.getElementById('validation-warning');
  const unansweredCount = document.getElementById('unanswered-count');
  const submitHint = document.getElementById('submit-hint');

  // ============================================================
  // RENDER QUESTIONS BY TYPE
  // ============================================================

  function renderQuestions() {
    container.innerHTML = '';
    questions.forEach(function(q) {
      const div = document.createElement('div');
      div.className = 'question';
      div.id = 'question-' + q.number;

      // Question number
      const num = document.createElement('div');
      num.className = 'question-number';
      num.textContent = 'Question ' + q.number;
      div.appendChild(num);

      // Question text
      const text = document.createElement('div');
      text.className = 'question-text';
      text.textContent = q.text;
      div.appendChild(text);

      // Render by type
      switch (q.type) {
        case 'true-false-not-given':
          renderTFNG(div, q);
          break;
        case 'multiple-choice':
          renderMC(div, q);
          break;
        case 'gap-fill':
          renderGapFill(div, q);
          break;
        case 'matching':
          renderMatching(div, q);
          break;
        default:
          console.warn('Unknown question type:', q.type);
      }

      container.appendChild(div);
    });

    submitHint.textContent = questions.length + ' questions';
  }

  function renderTFNG(container, q) {
    var row = document.createElement('div');
    row.className = 'options-row';
    row.setAttribute('role', 'radiogroup');
    row.setAttribute('aria-label', 'Question ' + q.number + ' answer options');

    ['TRUE', 'FALSE', 'NOT GIVEN'].forEach(function(value, idx) {
      var opt = document.createElement('div');
      opt.className = 'option';

      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + q.number;
      input.id = 'q' + q.number + '-' + idx;
      input.value = value;
      input.setAttribute('data-question', q.number);

      var label = document.createElement('label');
      label.setAttribute('for', 'q' + q.number + '-' + idx);
      label.textContent = value;
      label.className = value === 'TRUE' ? 'label-true' : value === 'FALSE' ? 'label-false' : 'label-not-given';

      opt.appendChild(input);
      opt.appendChild(label);
      row.appendChild(opt);
    });

    container.appendChild(row);
  }

  function renderMC(container, q) {
    var row = document.createElement('div');
    row.className = 'options-vertical';
    row.setAttribute('role', 'radiogroup');
    row.setAttribute('aria-label', 'Question ' + q.number + ' answer options');

    (q.options || []).forEach(function(opt, idx) {
      var div = document.createElement('div');
      div.className = 'option-mc';

      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + q.number;
      input.id = 'q' + q.number + '-' + idx;
      input.value = opt.label;
      input.setAttribute('data-question', q.number);

      var label = document.createElement('label');
      label.setAttribute('for', 'q' + q.number + '-' + idx);
      label.innerHTML = '<span class="option-label-marker">' + opt.label + '</span> ' + opt.text;

      div.appendChild(input);
      div.appendChild(label);
      row.appendChild(div);
    });

    container.appendChild(row);
  }

  function renderGapFill(container, q) {
    var text = q.text;
    var inputHtml = '<input type="text" class="gap-input" name="q' + q.number +
      '" data-question="' + q.number + '" aria-label="Answer for question ' + q.number + '" autocomplete="off" spellcheck="false">';
    var displayText = text.replace(/___/g, inputHtml);

    var div = document.createElement('div');
    div.className = 'gap-fill-text';
    div.innerHTML = displayText;
    container.appendChild(div);
  }

  function renderMatching(container, q) {
    var table = document.createElement('table');
    table.className = 'matching-table';
    table.setAttribute('role', 'group');
    table.setAttribute('aria-label', 'Question ' + q.number + ' — match each item');

    var thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Item</th><th>Match to</th></tr>';
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    (q.items || []).forEach(function(item) {
      var tr = document.createElement('tr');

      var tdLabel = document.createElement('td');
      tdLabel.textContent = item.label + '. ' + item.text;
      tr.appendChild(tdLabel);

      var tdSelect = document.createElement('td');
      var select = document.createElement('select');
      select.className = 'matching-select';
      select.name = 'q' + q.number + '-' + item.label;
      select.setAttribute('data-question', q.number);
      select.setAttribute('data-item', item.label);
      select.setAttribute('aria-label', 'Match ' + item.label + ' to');

      var defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = '-- Select --';
      select.appendChild(defaultOpt);

      (q.options || []).forEach(function(opt) {
        var option = document.createElement('option');
        option.value = opt.label;
        option.textContent = opt.label + '. ' + opt.text;
        select.appendChild(option);
      });

      tdSelect.appendChild(select);
      tr.appendChild(tdSelect);
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.appendChild(table);
  }

  // ============================================================
  // COLLECT ANSWERS
  // ============================================================

  function collectAnswers() {
    var answers = {};
    var unanswered = [];

    questions.forEach(function(q) {
      var key = String(q.number);

      switch (q.type) {
        case 'true-false-not-given':
        case 'multiple-choice': {
          var selected = document.querySelector('input[name="q' + q.number + '"]:checked');
          if (selected) {
            answers[key] = selected.value;
          } else {
            unanswered.push(q.number);
          }
          break;
        }
        case 'gap-fill': {
          var input = document.querySelector('input[name="q' + q.number + '"]');
          if (input && input.value.trim()) {
            answers[key] = input.value.trim();
          } else {
            unanswered.push(q.number);
          }
          break;
        }
        case 'matching': {
          var allAnswered = true;
          (q.items || []).forEach(function(item) {
            var select = document.querySelector('select[name="q' + q.number + '-' + item.label + '"]');
            if (select && select.value) {
              answers[key + '-' + item.label] = select.value;
            } else {
              allAnswered = false;
            }
          });
          if (!allAnswered) unanswered.push(q.number);
          break;
        }
      }
    });

    return { answers: answers, unanswered: unanswered };
  }

  // ============================================================
  // SCORE + SHOW RESULTS
  // ============================================================

  function scoreAnswers(userAnswers) {
    var total = questions.length;
    var correct = 0;
    var results = [];

    questions.forEach(function(q) {
      var userAnswer, isCorrect;

      switch (q.type) {
        case 'true-false-not-given':
        case 'multiple-choice':
          userAnswer = userAnswers[String(q.number)] || '(no answer)';
          isCorrect = userAnswer === q.correctAnswer;
          break;

        case 'gap-fill':
          userAnswer = userAnswers[String(q.number)] || '(no answer)';
          var acceptable = q.acceptableAnswers || [q.correctAnswer];
          isCorrect = acceptable.some(function(a) {
            return a.toLowerCase().trim() === userAnswer.toLowerCase().trim();
          });
          break;

        case 'matching':
          var itemCorrect = true;
          (q.items || []).forEach(function(item) {
            var key = q.number + '-' + item.label;
            var matchAnswer = userAnswers[key] || '';
            if (matchAnswer !== (q.correctMatches || {})[item.label]) {
              itemCorrect = false;
            }
          });
          userAnswer = JSON.stringify(userAnswers);
          isCorrect = itemCorrect;
          break;

        default:
          isCorrect = false;
          userAnswer = '(unknown type)';
      }

      if (isCorrect) correct++;
      results.push({
        number: q.number,
        correct: isCorrect,
        userAnswer: userAnswer,
        correctAnswer: q.correctAnswer,
        explanation: q.explanation || ''
      });
    });

    return { total: total, correct: correct, results: results };
  }

  function showResults(scoring) {
    var pct = scoring.total > 0 ? Math.round((scoring.correct / scoring.total) * 100) : 0;
    var isGood = pct >= 60;

    var headerClass = isGood ? 'great-job' : 'needs-work';
    var emoji = isGood ? '&#127775;' : '&#128170;';
    var title = isGood ? 'Great work!' : 'Keep going!';
    var message = isGood
      ? 'You\'re making solid progress. Ready for the next challenge?'
      : 'These are opportunities to improve. Each mistake is a chance to learn something new. Let\'s look at what needs work.';

    var html = '';
    html += '<div class="results-header ' + headerClass + '">';
    html += '  <div class="results-score">' + emoji + ' ' + scoring.correct + '/' + scoring.total + '</div>';
    html += '  <div class="results-label">' + title + '</div>';
    html += '  <div class="results-message">' + message + '</div>';
    html += '</div>';

    scoring.results.forEach(function(r) {
      var cls = r.correct ? 'correct' : 'incorrect';
      var icon = r.correct ? '&#10003;' : '&#10007;';
      html += '<div class="result-item ' + cls + '">';
      html += '  <span class="result-icon">' + icon + '</span>';
      html += '  <span>';
      html += '    <strong>Q' + r.number + ' — ' + (r.correct ? 'Correct' : 'Incorrect') + '</strong>';
      if (!r.correct) {
        html += '<br>Your answer: <em>' + escapeHtml(String(r.userAnswer)) + '</em>';
        html += ' &rarr; Correct: <em>' + escapeHtml(String(r.correctAnswer)) + '</em>';
      }
      if (r.explanation) {
        html += '<br>' + escapeHtml(r.explanation);
      }
      html += '  </span>';
      html += '</div>';
    });

    resultsDiv.innerHTML = html;
    resultsDiv.classList.add('visible');
    resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ============================================================
  // SAVE RESULTS (POST /save with localStorage fallback)
  // ============================================================

  function saveResults(scoring) {
    var payload = {
      skill: 'reading',
      kcTags: kcTags,
      testTitle: document.title,
      date: new Date().toISOString(),
      totalQuestions: scoring.total,
      correctCount: scoring.correct,
      score: Math.round((scoring.correct / scoring.total) * 100),
      results: scoring.results
    };

    fetch(BRIDGE_URL + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('Server returned ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      console.log('Results saved:', data);
      clearPendingResults();
    })
    .catch(function(err) {
      console.warn('Save failed, storing in localStorage:', err.message);
      localStorage.setItem('pendingResults', JSON.stringify(payload));
      warningBanner.classList.add('visible');
    });
  }

  function retrySave() {
    var pending = localStorage.getItem('pendingResults');
    if (!pending) {
      warningBanner.classList.remove('visible');
      return;
    }

    fetch(BRIDGE_URL + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: pending
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('Server returned ' + resp.status);
      return resp.json();
    })
    .then(function() {
      clearPendingResults();
      warningBanner.classList.remove('visible');
      console.log('Pending results saved successfully.');
    })
    .catch(function(err) {
      console.warn('Retry failed:', err.message);
    });
  }

  function clearPendingResults() {
    localStorage.removeItem('pendingResults');
  }

  // ============================================================
  // VALIDATION — highlight unanswered questions
  // ============================================================

  function highlightUnanswered(unanswered) {
    // Remove old highlights
    document.querySelectorAll('.question.unanswered').forEach(function(el) {
      el.classList.remove('unanswered');
    });

    // Add new highlights
    unanswered.forEach(function(num) {
      var el = document.getElementById('question-' + num);
      if (el) el.classList.add('unanswered');
    });

    // Scroll to first unanswered
    if (unanswered.length > 0) {
      var first = document.getElementById('question-' + unanswered[0]);
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // ============================================================
  // FORM SUBMIT
  // ============================================================

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var collected = collectAnswers();

    if (collected.unanswered.length > 0) {
      highlightUnanswered(collected.unanswered);
      unansweredCount.textContent = collected.unanswered.length;
      validationWarning.classList.add('visible');
      return;
    }

    validationWarning.classList.remove('visible');
    highlightUnanswered([]);

    // Disable form
    var inputs = form.querySelectorAll('input, select, button');
    inputs.forEach(function(el) { el.disabled = true; });

    var scoring = scoreAnswers(collected.answers);
    showResults(scoring);
    saveResults(scoring);
  });

  // ============================================================
  // RETRY PENDING ON LOAD
  // ============================================================

  var pending = localStorage.getItem('pendingResults');
  if (pending) {
    warningBanner.classList.add('visible');
  }

  // ============================================================
  // INIT
  // ============================================================

  renderQuestions();
})();
</script>

</body>
</html>
