<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TEST_TITLE}} — IELTS Claude Teacher</title>
<meta name="kc-tags" content="{{KC_TAGS}}">
<!--
  mini-test.html — Self-contained template for Claude-generated practice tests.
  Claude replaces {{PLACEHOLDERS}} with test content, saves to .ielts/lesson-plans/.

  Uses shared base-test.css + base-test.js for design system and app logic.

  Supported question types: true-false-not-given, yes-no-not-given,
    multiple-choice, gap-fill, matching
  Posts results to File Bridge POST /save. Falls back to localStorage.

  Design: typography-driven, desktop-first, semantic colors, keyboard accessible.
-->
<link rel="stylesheet" href="/lessons/shared/base-test.css">
<style>
  /* Source attribution for web-researched content */
  .source-attribution {
    margin-top: 0.75rem;
    padding: 0.6rem 0.85rem;
    background: var(--color-surface-2, #f4f4f5);
    border-left: 3px solid var(--color-accent, #2563eb);
    border-radius: 0 4px 4px 0;
    font-size: 0.85rem;
    color: var(--color-text-secondary, #6b7280);
    line-height: 1.5;
  }
  .source-attribution a {
    color: var(--color-accent, #2563eb);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .source-attribution a:hover {
    color: var(--color-accent-hover, #1d4ed8);
  }
  .source-label {
    font-weight: 600;
    color: var(--color-text-primary, #1f2937);
  }
  .source-author {
    color: var(--color-text-tertiary, #9ca3af);
    margin-left: 0.35rem;
  }
  .source-domain {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 0.1rem 0.4rem;
    background: var(--color-surface-3, #e5e7eb);
    border-radius: 3px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="container" role="main" aria-label="{{TEST_TITLE}}">

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="test-header">
    <div class="test-badge" aria-label="Skill and question type">{{SKILL_LABEL}} · {{QUESTION_TYPE_LABEL}}</div>
    <h1 class="test-title">{{TEST_TITLE}}</h1>
    <p class="test-instructions">{{INSTRUCTIONS}}</p>
    {{SOURCE_ATTRIBUTION_HTML}}
  </header>

  <!-- ═══════════════ QUESTIONS ═══════════════ -->
  <form id="test-form" novalidate aria-label="Practice test questions">
    <div class="question-group" id="questions-container">
      <!-- Questions rendered by JS from __TEST_CONFIG__ -->
    </div>

    <!-- Submit -->
    <div class="submit-area">
      <button type="submit" class="btn-submit" id="btn-submit">Submit Answers</button>
      <span class="submit-hint" id="submit-hint">{{QUESTIONS_COUNT}} questions</span>
    </div>

    <!-- Validation warning -->
    <div class="validation-warning" id="validation-warning" role="alert">
      Please answer all questions before submitting. <span id="unanswered-count"></span> question(s) remaining.
    </div>
  </form>

  <!-- Results -->
  <section class="results" id="results" aria-live="polite" aria-label="Test results"></section>

  <!-- Server warning -->
  <div class="warning-banner" id="warning-banner" role="alert">
    <span>&#9888; Server not running. Results saved locally.</span>
    <button class="btn-retry" onclick="retrySave()">Start server.py and click Retry</button>
  </div>

</div>

<!-- ═══════════════ TEST DATA ═══════════════ -->
<script>
window.__TEST_CONFIG__ = {
  questions: {{QUESTIONS_JSON}},
  kcTags: {{KC_TAGS}},
  skill: '{{SKILL_KEY}}',
  testTitle: '{{TEST_TITLE}}',
  bridgeUrl: 'http://localhost:8765'
};
</script>

<!-- ═══════════════ SHARED APP LOGIC ═══════════════ -->
<script src="/lessons/shared/base-test.js"></script>

</body>
</html>
